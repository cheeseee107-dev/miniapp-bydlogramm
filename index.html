<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер</title>
    <!-- Подключаем библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            /* Используем системные цвета Телеграма */
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: var(--tg-theme-hint-color, #a8a8a8);
            font-size: 14px;
            margin-bottom: 40px;
        }
        .main-btn {
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .main-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Анонимный чат</h1>
        <p>Найди случайного собеседника прямо сейчас</p>
        <button class="main-btn" id="searchBtn">Найти собеседника</button>
    </div>

    <script>
        // Инициализация Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Вешаем событие на кнопку
        document.getElementById("searchBtn").addEventListener("click", () => {
            // Отправляем сигнал обратно в наш Python-скрипт
            tg.sendData("start_search"); 
            tg.close(); // Закрываем красивое меню
        });
    </script>

</body>
</html>
